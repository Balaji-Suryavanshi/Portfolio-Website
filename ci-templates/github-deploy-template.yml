name: Build and Deploy Portfolio to GCP VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/moncy-portfolio:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE }}
        cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}
        cache-to: type=inline

    - name: Deploy to GCP Compute Engine VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_VM_IP || '35.244.41.125' }}
        username: ${{ secrets.GCP_SSH_USERNAME }}
        key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Pulling latest Docker image..."
          docker pull ${{ env.DOCKER_IMAGE }}
          echo "Stopping existing container if running..."
          docker stop portfolio-container || true
          docker rm portfolio-container || true
          echo "Starting new container on port 8080..."
          docker run -d --restart=always -p 8080:80 --name portfolio-container ${{ env.DOCKER_IMAGE }}
          echo "Deployment successful! Pruning old images..."
          docker image prune -f
