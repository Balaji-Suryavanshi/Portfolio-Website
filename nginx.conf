server {
    listen 80;
    server_name balajisuryavanshi.site www.balajisuryavanshi.site localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for lightning-fast 3D asset & script delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/octet-stream image/svg+xml;

    # Caching for static assets (images, fonts, hdr models, compiled bundles)
    location ~* \.(?:ico|css|js|gif|webp|jpe?g|png|woff2?|eot|ttf|otf|svg|hdr|glb|gltf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
